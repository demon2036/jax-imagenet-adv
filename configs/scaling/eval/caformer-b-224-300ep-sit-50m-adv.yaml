
output_dir: $GCS_MODEL_DIR/scaling/preliminary
name: caformer-b-224-300ep-siT-50m-ft-30ep
project: jax-adv-image-net-scaling-preliminary
steps: 1281167
training_epoch: 30
warmup_epoch: 10
log_interval: 100
eval_epoch: 5
grad_accum_steps: 1

#resume: True
valid_fn: validation_adv_step_exp

dataset:
  train_batch_size: 4096
  valid_batch_size: 2048
  train_loader_workers: 20
  valid_loader_workers: 10
  train_dataset_shards: "$GCS_DATASET_DIR/imagenet-1k-wds/imagenet1k-train-{0000..1023}.tar"
  valid_dataset_shards: "$GCS_DATASET_DIR/imagenet-1k-wds/imagenet1k-validation-{00..63}.tar"
  random_crop: rrc
  color_jitter: 0.0
  auto_augment: "none"
  random_erasing: 0.0
  auto_generated_augment: "none"
  color_generated_jitter: 0.0
  random_generated_erasing: 0.0
  augment_repeats: 3
  test_crop_ratio: 0.875
  shuffle_seed: 1
  image_size: 224
  generated_dataset_shards:
    ['$GCS_MODEL_DIR/imagenet-generated-sit-250steps-50m/shards-{00000..05983}.tar']
  dataset_mix_ratio: 0.9
  max_syn_ratio: 0.0
  min_syn_ratio: 0.0
  scheduler: 'cosine'


train_state:
  train_module:
    target: 'train_modules.EXPTrainAdvModule'
    mixup: 0.8
    cutmix: 1.0
    criterion: ce
    label_smoothing: 0.1
    train_adv_step: 10
    train_adv_step_size: 10/1 / 255


  model:
    target: 'models.CAFormer'
    model_kwargs:
      labels: 1000
      qk_norm: False
      depths: [3, 12, 18, 3]
      dims: [128, 256, 512, 768]

  optimizer:
    target: 'lamb'
    optimizer_kwargs:
      learning_rate: 4.0e-3
      weight_decay: 0.05
      b1: 0.9
      b2: 0.999


#  optimizer:
#    target: 'lamb'
#    optimizer_kwargs:
#      learning_rate: 4.0e-3
#      weight_decay: 0.05
#      b1: 0.9
#      b2: 0.999


  init_seed: 1
  mixup_seed: 1
  dropout_seed: 1
  ema_decay: 0.9998
  pretrained_ckpt: '$GCS_MODEL_DIR/scaling/preliminary/caformer-b-224-300ep-siT-50m-ema'



