
output_dir: $GCS_MODEL_DIR/planb/ablation/best
name: test
project: jax-adv-image-net-best
steps: 13151276
training_epoch: 90
warmup_epoch: 20
log_interval: 100
eval_epoch: 10
grad_accum_steps: 1

#resume: True

dataset:
  train_batch_size: 2048
  valid_batch_size: 2048
  train_loader_workers: 20
  valid_loader_workers: 10
  train_dataset_shards: "$GCS_DATASET_DIR/imagenet-1k-wds/imagenet1k-train-{0000..1023}.tar"
  valid_dataset_shards: "$GCS_DATASET_DIR/imagenet-1k-wds/imagenet1k-validation-{00..63}.tar"
  random_crop: src
  color_jitter: 0.0
  auto_augment: "rand-m9-mstd0.5-inc1"
  random_erasing: 0.0
  auto_generated_augment: "rand-m9-mstd0.5-inc1"
  color_generated_jitter: 0.0
  random_generated_erasing: 0.0
  augment_repeats: 3
  test_crop_ratio: 0.875
  shuffle_seed: 1
  image_size: 224
  generated_dataset_shards:
    ['$GCS_MODEL_DIR/imagenet-generated-sit-250steps-50m/shards-{00000..05983}.tar']
  dataset_mix_ratio: 0.9


train_state:
  train_module:
    target: 'train_modules.TrainModule'
    mixup: 0.0
    cutmix: 0.0
    criterion: ce
    label_smoothing: 0.0


  model:
    target: 'models.ViT'
    model_kwargs:
      labels: 1000
      layers: 32
      dim: 1280
      heads: 16
      image_size: 224

#      drop_path_rate: 0.6
#      drop_rate: 0.5

  optimizer:
    target: 'adamw'
    optimizer_kwargs:
      learning_rate: 8.0e-4
#      eps: 1.0e-8
#      lr_decay: 1.0
#      clip_grad: 0.0


  init_seed: 1
  mixup_seed: 1
  dropout_seed: 1
  ema_decay: 0.9998
  pretrained_ckpt: None #'$GCS_MODEL_DIR/planb/ablation/standard/caformer-xl-36-standard-300ep-mix0.9-ema'






