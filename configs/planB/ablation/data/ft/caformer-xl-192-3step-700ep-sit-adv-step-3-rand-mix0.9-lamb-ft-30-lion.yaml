
output_dir: $GCS_MODEL_DIR/planb/ablation/best
name: caformer-xl-192-3step-700ep-sit-adv-step-3-rand-mix0.9-lamb-ft-30-lion
project: jax-adv-image-net-best
steps: 1281167
training_epoch: 30
warmup_epoch: 0
log_interval: 10
eval_epoch: 5
grad_accum_steps: 1
#train_fn: training_step_kl
dp: -1
fsdp: 1
tp: 1
#resume: True

dataset:
  train_batch_size: 4096
  valid_batch_size: 4096
  train_loader_workers: 20
  valid_loader_workers: 10
  train_dataset_shards: "$GCS_DATASET_DIR/imagenet-1k-wds/imagenet1k-train-{0000..1023}.tar"
  valid_dataset_shards: "$GCS_DATASET_DIR/imagenet-1k-wds/imagenet1k-validation-{00..63}.tar"
  random_crop: rrc
  color_jitter: 0.0
  auto_augment: "rand-m9-mstd0.5-inc1"
  random_erasing: 0.25
  auto_generated_augment: "rand-m9-mstd0.5-inc1"
  color_generated_jitter: 0.0
  random_generated_erasing: 0.0
  augment_repeats: 3
  test_crop_ratio: 0.875
  shuffle_seed: 3
  image_size: 224
  generated_dataset_shards:
#    ['$GCS_MODEL_DIR/imagenet-generated-100steps-cfg1.0-eta0.0/shards-{00000..12799}.tar']
    ['$GCS_MODEL_DIR/imagenet-generated-sit-250steps-50m/shards-{00000..05983}.tar']
  dataset_mix_ratio: 0.9
  max_syn_ratio: 0.0
  min_syn_ratio: 0.0
  scheduler: 'cosine'


train_state:
  train_module:
    target: 'train_modules.TrainAdvModule2'
    mixup: 0.8
    cutmix: 1.0
    criterion: ce
    label_smoothing: 0.1
    train_adv_step: 10
    train_adv_step_size: 1 / 255


  model:
    target: 'models.CAFormer'
    model_kwargs:
      depths: [8,8,24,8]
      dims: [ 256, 512, 768,1536]
      v_norm: False
#      drop_path_rate: 0.6
#      drop_rate: 0.5

  optimizer:
    target: 'lion'
#    clip_grad: None
    optimizer_kwargs:
#      clip_grad: None
      learning_rate: 3.0e-5
      init_value: 1.0e-7
      end_learning_rate: 1.0e-6
      weight_decay: 0.05
      b1: 0.9
      b2: 0.99
#      eps: 1.0e-8
#      lr_decay: 1.0
#      clip_grad: 0.0
  grad_accum_steps: 1
  init_seed: 1
  mixup_seed: 1
  dropout_seed: 1
  ema_decay: 0.9998
  pretrained_ckpt: '$GCS_MODEL_DIR/planb/ablation/data/pt/caformer-xl-192-3step-700ep-sit-ema'



restore_state:
  optimizer:
      target: 'lamb'
      optimizer_kwargs:
        learning_rate: 1.0e-3
        init_value: 1.0e-6
        end_learning_rate: 1.0e-5
        weight_decay: 0.05
        b1: 0.9
        b2: 0.99



#      optimizer_kwargs:



