
output_dir: $GCS_MODEL_DIR/planb/ablation/standard
name: caformer-xl-48-standard-300ep-mix0.9-wsd
project: deit3-jax-ablation-standard
steps: 1281167
training_epoch: 400
warmup_epoch: 20
log_interval: 100
eval_epoch: 10
valid_fn: validation_step
#resume: True

dataset:
  train_batch_size: 4096
  valid_batch_size: 2048
  train_loader_workers: 20
  valid_loader_workers: 10
  train_dataset_shards: "$GCS_DATASET_DIR/imagenet-1k-wds/imagenet1k-train-{0000..1023}.tar"
  valid_dataset_shards: "$GCS_DATASET_DIR/imagenet-1k-wds/imagenet1k-validation-{00..63}.tar"
  random_crop: rrc
  color_jitter: 0.0
  auto_augment: "rand-m9-mstd0.5-inc1"
  random_erasing: 0.0
  auto_generated_augment: "rand-m9-mstd0.5-inc1"
  color_generated_jitter: 0.0
  random_generated_erasing: 0.0
  augment_repeats: 3
  test_crop_ratio: 0.875
  shuffle_seed: 1
  image_size: 192
  generated_dataset_shards:
    ['$GCS_MODEL_DIR/imagenet-generated-sit-250steps-50m/shards-{00000..05983}.tar']
  dataset_mix_ratio: 0.9

train_state:
  train_module:
    target: 'train_modules.TrainModule'
    mixup: 0.8
    cutmix: 1.0
    criterion: ce
    label_smoothing: 0.1



  model:
    target: 'models.CAFormer'
    model_kwargs:
      depths: [8,8,24,8]
      dims: [ 256, 512, 768,1536]
      drop_path_rate: 0.2
      drop_rate: 0.5
#      ls_init_value: null

  optimizer:
    target: 'lion'
    optimizer_kwargs:
      schedule: wsd
      learning_rate: 1.0e-4
      end_learning_rate: 1.0e-5
      init_value: 1.0e-7

      weight_decay: 0.5
      b1: 0.9
      b2: 0.99
#      eps: 1.0e-8
#      lr_decay: 1.0
#      clip_grad: 0.0
  ema_decay: 0.9998
  pretrained_ckpt: None
  init_seed: 1
  mixup_seed: 1
  dropout_seed: 1







